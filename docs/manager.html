<p>جارٍ تحويلك إلى لوحة البيانات المناسبة…</p>
<script>
  (function () {
    var u = null;
    try { u = JSON.parse(localStorage.getItem('user')); } catch (e) { u = null; }
    if (!u) { window.location.href = 'login.html'; return; }
    if (u.role === 'full_access' || u.role === 'manager') {
      window.location.href = 'manager/dashboard1.html';
      return;
    }
    var m = (u.role || '').match(/^section_([1-7])$/);
    if (m) {
      window.location.href = 'manager/dashboard' + m[1] + '.html';
      return;
    }
    window.location.href = 'index.html';
  })();
</script>
